            - heading "Polityka prywatności" [level=1] [ref=e25]
            - paragraph [ref=e26]: "Ostatnia aktualizacja: 27 sierpnia 2026"
            - generic [ref=e27]:
                - paragraph [ref=e28]: "Niniejsza polityka prywatności określa zasady przetwarzania danych osobowych przez witrynę pod nazwą www.ccomplex.pl, której właścicielem jest Agnieszka Jaszczyk-Kożuch i Sebastian Kożuch, prowadzący działalność gospodarczą pod nazwą CCOMPLEX sp. z o.o. pod adresem Opole 45-130, ul. Kępska 12, wpisany do Centralnej Ewidencji i Informacji Działalności Gospodarczej prowadzonej przez Ministra ds. Gospodarki pod numerem NIP: 7543359039, REGON: 525049847, KRS 0001031202, adres poczty elektronicznej e-mail: info@ccomplex.pl i biuro@ccomplex.pl oraz numery telefonu 661 242 507 i 781 429 378 (zwaną dalej „Administratorem”)."
                - generic [ref=e29]:
                    - heading "Ochrona danych osobowych" [level=2] [ref=e30]
                    - paragraph [ref=e31]: Szanowni Państwo,
                    - paragraph [ref=e32]: Ochrona danych osobowych Klientów firmy CCOMPLEX sp. z o.o. to jeden z najważniejszych aspektów naszej pracy. Szanujemy Państwa prywatność i dokładamy wszelkich starań, aby Państwa dane osobowe były bezpieczne. W związku z tym przekazujemy Państwu informacje o najważniejszych kwestiach związanych z przetwarzaniem Państwa danych osobowych.
                    - paragraph [ref=e33]: "Firma CCOMPLEX sp. z o.o. informuje, że zgodnie z art. 13 ust. 1 i 2 ogólnego Rozporządzenia o Ochronie Danych Osobowych z dnia 27 kwietnia 2016 r. (dalej RODO):"
                - paragraph [ref=e35]: 1. Administratorem Pani/Pana danych osobowych jest firma CCOMPLEX sp. z o.o., Opole 45-130, ul. Kępska 12.
                - generic [ref=e36]:
                    - paragraph [ref=e37]: "2. Pani/Pana dane osobowe przetwarzane będą w celu przesłania:"
                    - list [ref=e38]:
                        - listitem [ref=e39]:
                            - generic [ref=e41]: formularza wyceny tarasu,
                        - listitem [ref=e42]:
                            - generic [ref=e44]: formularza wyceny zadaszenia,
                        - listitem [ref=e45]:
                            - generic [ref=e47]: formularza wyceny żaluzji,
                        - listitem [ref=e48]:
                            - generic [ref=e50]: formularza wyceny schodów,
                        - listitem [ref=e51]:
                            - generic [ref=e53]: formularza kontaktowego.
                - generic [ref=e54]:
                    - paragraph [ref=e55]: "3. Osobie, której dane są przetwarzane przez Administratora, przysługuje:"
                    - list [ref=e56]:
                        - listitem [ref=e57]:
                            - generic [ref=e59]: prawo dostępu do treści danych, na podstawie art. 15 RODO;
                        - listitem [ref=e60]:
                            - generic [ref=e62]: prawo do sprostowania danych, na podstawie art. 16 RODO;
                        - listitem [ref=e63]:
                            - generic [ref=e65]: prawo do usunięcia danych, na podstawie art. 17 RODO;
                        - listitem [ref=e66]:
                            - generic [ref=e68]: prawo do ograniczenia przetwarzania danych, na podstawie art. 18 RODO;
                        - listitem [ref=e69]:
                            - generic [ref=e71]: prawo do przenoszenia danych, na podstawie art. 20 RODO;
                        - listitem [ref=e72]:
                            - generic [ref=e74]: prawo wniesienia sprzeciwu wobec przetwarzania danych, na podstawie art. 21 RODO.
                    - paragraph [ref=e75]: "(Uwaga: realizacja powyższych praw musi być zgodna z przepisami prawa, na podstawie których odbywa się przetwarzanie danych)."
                - generic [ref=e76]:
                    - paragraph [ref=e77]: 4. W przypadku, w którym przetwarzanie Pani/Pana danych odbywa się na podstawie zgody (tj. art. 6 ust. 1 lit. a RODO), przysługuje Pani/Panu prawo do wycofania zgody w dowolnym momencie, przy czym cofnięcie zgody nie ma wpływu na zgodność przetwarzania, którego dokonano na jej podstawie przed cofnięciem zgody.
                    - paragraph [ref=e78]: 5. Ma Pani/Pan prawo wniesienia skargi do organu nadzorczego, tj. Prezesa Urzędu Ochrony Danych Osobowych, gdy Pani/Pan uzna, że przetwarzanie danych osobowych narusza przepisy RODO.
                    - paragraph [ref=e79]: 6. Podanie przez Panią/Pana danych osobowych jest warunkiem kontaktu, w tym w sprawie wycen i innych zapytań związanych z prowadzoną przez nas działalnością.
                    - paragraph [ref=e80]: 7. Pani/Pana dane osobowe nie podlegają zautomatyzowanemu podejmowaniu decyzji, w tym profilowaniu.
                - generic [ref=e81]:
                    - heading "Pliki cookies" [level=2] [ref=e82]
                    - paragraph [ref=e83]: Witryna internetowa nie zbiera w sposób automatyczny żadnych danych, z wyjątkiem danych zawartych w plikach cookies podczas samego korzystania z witryny. Pliki cookies to małe pliki tekstowe wysyłane przez Witrynę internetową i przechowywane na Państwa komputerze, zawierające pewne informacje związane z korzystaniem przez Państwa z Witryny internetowej. Wykorzystywane przez Witrynę internetową pliki cookies mogą mieć charakter tymczasowy lub trwały. Tymczasowe pliki cookies są usuwane z chwilą zamknięcia przeglądarki, natomiast stałe pliki cookies są przechowywane także po zakończeniu korzystania przez Państwa z witryny i służą do przechowywania informacji takich jak Państwa hasło czy login, co przyspiesza i ułatwia korzystanie z Witryny.
                    - paragraph [ref=e84]: W każdym wypadku mogą Państwo zablokować instalowanie plików cookies lub usunąć stałe pliki cookies, wykorzystując stosowne opcje Państwa przeglądarki internetowej. W razie problemów doradzamy skorzystać z pliku pomocy przeglądarki lub skontaktować się z producentem przeglądarki, z której Państwo korzystacie.
                    - paragraph [ref=e85]: Dane są przechowywane przez okres niezbędny do świadczenia usługi żądanej przez Użytkownika lub też przez okres określony przez cele opisane w niniejszym dokumencie. Użytkownik może zawsze poprosić Administratora Danych o zawieszenie lub usunięcie danych.
