                            - paragraph [ref=f3e329]: Materiał kupujesz sam
                            - paragraph [ref=f3e330]: Kupując materiał na własną rękę, płacisz za niego podstawową stawkę VAT, niezależnie od tego, kto wykona montaż.
                    - paragraph [ref=f3e331]: Obniżona stawka VAT dotyczy robót w obiektach budownictwa objętego społecznym programem mieszkaniowym i wymaga spełnienia warunków ustawowych. Ostateczną stawkę potwierdzamy indywidualnie na etapie wyceny.
