                - generic [ref=f3e256]:
                    - paragraph [ref=f3e257]: Specyfikacja
                    - heading "Montaż i specyfikacja techniczna" [level=2] [ref=f3e258]
                    - paragraph [ref=f3e259]: Realizujemy kompleksowy montaż zadaszeń — od pomiaru przez projekt po odbiór. Poniżej znajdziesz kluczowe informacje przed podjęciem decyzji.
                - generic [ref=f3e260]:
                    - generic [ref=f3e261]:
                        - heading "Montaż zadaszeń" [level=3] [ref=f3e266]
                        - paragraph [ref=f3e267]: Montaż realizujemy na terenie województw śląskiego i opolskiego. Czas realizacji od zamówienia wynosi zazwyczaj 3–6 tygodni. Ekipa montażowa pracuje sprawnie, minimalizując uciążliwości dla domowników.
                    - generic [ref=f3e268]:
                        - heading "Umowa i gwarancja" [level=3] [ref=f3e274]
                        - paragraph [ref=f3e275]: Każda realizacja objęta jest umową pisemną z określonym zakresem prac i terminem. Udzielamy gwarancji na wykonanie montażu oraz przekazujemy gwarancję producenta na materiały i konstrukcję.
                    - generic [ref=f3e276]:
                        - heading "Podatek VAT" [level=3] [ref=f3e281]
                        - paragraph [ref=f3e282]: Przy montażu zadaszeń na budynkach mieszkalnych zastosowanie może mieć obniżona stawka VAT 8%. Szczegóły ustalamy indywidualnie na etapie wyceny.
                    - generic [ref=f3e283]:
                        - heading "Realizacje" [level=3] [ref=f3e289]
                        - paragraph [ref=f3e290]: Zrealizowaliśmy setki zadaszeń na terenie Śląska i Opolszczyzny. Chętnie pokażemy przykłady podobnych realizacji w Twojej okolicy przed podjęciem decyzji.
                    - generic [ref=f3e291]:
                        - heading "Wymiary i konfiguracja" [level=3] [ref=f3e300]
                        - paragraph [ref=f3e301]: Zadaszenia wykonujemy na wymiar — szerokość do 8 m, wysięg do 4 m w zależności od systemu. Możliwość montażu do ściany lub jako konstrukcja wolnostojąca.
                    - generic [ref=f3e302]:
                        - heading "Bezpłatna konsultacja" [level=3] [ref=f3e307]
                        - paragraph [ref=f3e308]: Oferujemy bezpłatną wizytę pomiarową i konsultację na miejscu inwestycji. Skontaktuj się z nami, aby umówić termin.
            - generic [ref=f3e310]:
                - generic [ref=f3e311]:
                    - paragraph [ref=f3e312]: Korzyść podatkowa
                    - heading "Kupujemy materiał za Ciebie — płacisz niższy VAT" [level=2] [ref=f3e316]
                    - paragraph [ref=f3e317]: Gdy materiał kupujesz samodzielnie, płacisz za niego pełną stawkę VAT. Gdy zamawiasz u nas całą realizację razem z materiałem, do rozliczenia wchodzi obniżona stawka — a różnica zostaje w Twoim budżecie.
                    - link "Zapytaj o wycenę" [ref=f3e318] [cursor=pointer]:
                        - /url: /wycena
                - generic [ref=f3e321]:
                    - generic [ref=f3e322]:
