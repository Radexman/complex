                - generic [ref=f5e41]:
                    - paragraph [ref=f5e42]: Zalety produktu
                    - heading "Dlaczego warto wybrać zadaszenie tarasowe?" [level=2] [ref=f5e43]
                    - paragraph [ref=f5e44]: Zadaszenia tarasowe łączą estetykę z funkcjonalnością. Trwała konstrukcja z aluminium zapewnia ochronę przed deszczem i słońcem przez cały rok, a szeroki wybór modeli i kolorów pozwala dopasować zadaszenie do każdego stylu architektury.
                - generic [ref=f5e45]:
                    - generic [ref=f5e46]:
                        - heading "Trwała konstrukcja" [level=3] [ref=f5e51]
                        - paragraph [ref=f5e52]: Aluminium odporne na korozję i warunki atmosferyczne przez dziesiątki lat.
                    - generic [ref=f5e53]:
                        - heading "Ochrona przed deszczem" [level=3] [ref=f5e58]
                        - paragraph [ref=f5e59]: Szczelna konstrukcja chroni taras przez cały rok, niezależnie od pogody.
                    - generic [ref=f5e60]:
                        - heading "Ochrona przed słońcem" [level=3] [ref=f5e68]
                        - paragraph [ref=f5e69]: Regulowane systemy pozwalają kontrolować nasłonecznienie tarasu.
                    - generic [ref=f5e70]:
                        - heading "Wymiary na zamówienie" [level=3] [ref=f5e78]
                        - paragraph [ref=f5e79]: Każde zadaszenie projektujemy indywidualnie pod wymiary Twojego tarasu.
                    - generic [ref=f5e80]:
                        - heading "Profesjonalny montaż" [level=3] [ref=f5e84]
                        - paragraph [ref=f5e85]: Realizujemy montaż na terenie Śląska i Opolszczyzny z pełną gwarancją.
                    - generic [ref=f5e86]:
                        - heading "10 lat gwarancji" [level=3] [ref=f5e91]
                        - paragraph [ref=f5e92]: Długa gwarancja producenta na konstrukcję i mechanizmy.
            - generic [ref=f5e94]:
                - generic [ref=f5e95]:
                    - paragraph [ref=f5e96]: Jak to działa
                    - heading "Twoja droga do wymarzonego tarasu" [level=2] [ref=f5e97]
                    - paragraph [ref=f5e98]: Od pierwszego zapytania po gotową realizację objętą gwarancją — proces zaprojektowany tak, aby był prosty i przejrzysty na każdym etapie.
                - generic [ref=f5e100]:
                    - generic [ref=f5e107]:
                        - generic [ref=f5e108]:
                            - generic [ref=f5e109]: "01"
                            - heading "Zapytanie" [level=3] [ref=f5e110]
                        - paragraph [ref=f5e111]: Wysyłasz zapytanie poprzez formularz wyceny, e-mail lub telefonicznie. Opisujesz swoje potrzeby i wstępne oczekiwania dotyczące projektu.
                    - generic [ref=f5e117]:
                        - generic [ref=f5e118]:
                            - generic [ref=f5e119]: "02"
                            - heading "Wycena wstępna" [level=3] [ref=f5e120]
                        - paragraph [ref=f5e121]: Na podstawie przesłanych informacji przygotowujemy orientacyjną wycenę, która pozwala oszacować koszt realizacji jeszcze przed wizją lokalną.
                    - generic [ref=f5e131]:
                        - generic [ref=f5e132]:
                            - generic [ref=f5e133]: "03"
                            - heading "Pomiar" [level=3] [ref=f5e134]
                        - paragraph [ref=f5e135]: Umawiamy bezpłatną wizytę pomiarową na miejscu inwestycji. Dokładnie mierzymy przestrzeń i weryfikujemy warunki montażu.
                    - generic [ref=f5e143]:
                        - generic [ref=f5e144]:
                            - generic [ref=f5e145]: "04"
                            - heading "Wycena końcowa" [level=3] [ref=f5e146]
                        - paragraph [ref=f5e147]: Na podstawie wykonanych pomiarów przygotowujemy szczegółową, ostateczną wycenę uwzględniającą wszystkie ustalenia.
                    - generic [ref=f5e155]:
                        - generic [ref=f5e156]:
                            - generic [ref=f5e157]: "05"
                            - heading "Umowa" [level=3] [ref=f5e158]
                        - paragraph [ref=f5e159]: Po akceptacji wyceny podpisujemy umowę z jasno określonym zakresem prac, materiałami, terminem realizacji i warunkami płatności.
                    - generic [ref=f5e167]:
                        - generic [ref=f5e168]:
                            - generic [ref=f5e169]: "06"
                            - heading "Montaż" [level=3] [ref=f5e170]
                        - paragraph [ref=f5e171]: Nasza ekipa montażowa realizuje projekt zgodnie z umową i ustalonym harmonogramem, dbając o porządek i sprawny przebieg prac.
                    - generic [ref=f5e178]:
                        - generic [ref=f5e179]:
                            - generic [ref=f5e180]: "07"
                            - heading "Gwarancja" [level=3] [ref=f5e181]
                        - paragraph [ref=f5e182]: Po odbiorze prac przekazujemy gwarancję na montaż oraz materiały. Pozostajemy do dyspozycji w razie pytań lub potrzeby serwisu.
            - generic [ref=f5e184]:
                - generic [ref=f5e185]:
                    - paragraph [ref=f5e186]: Producenci i systemy
                    - heading "Dostępne systemy zadaszeń" [level=2] [ref=f5e187]
                    - paragraph [ref=f5e188]: Realizujemy zadaszenia w oparciu o sprawdzone systemy renomowanych producentów europejskich.
                - generic [ref=f5e189]:
