                - paragraph [ref=f5e300]: Kontakt bezpośredni
                - heading "Odwiedź naszą ekspozycję" [level=3] [ref=f5e301]
                - paragraph [ref=f5e302]: Najszybciej skontaktujesz się z nami telefonicznie lub mailowo — to nasze preferowane formy kontaktu.
                - generic [ref=f5e303]:
                    - link "+48 661 242 507" [ref=f5e304] [cursor=pointer]:
                        - /url: tel:+48661242507
                    - link "biuro@ccomplex.pl" [ref=f5e307] [cursor=pointer]:
                        - /url: mailto:biuro@ccomplex.pl
                - paragraph [ref=f5e311]: Na naszej zewnętrznej ekspozycji możesz zobaczyć zadaszenia tarasowe, materiały tarasowe oraz elementy dodatkowego wyposażenia. To najlepszy sposób, aby porównać rozwiązania i wybrać to, które najlepiej pasuje do Twojego domu. Przyjedź, zobacz i porównaj dostępne rozwiązania przed podjęciem decyzji. Teren wystawki jest ogólnodostępny – możesz odwiedzić ją w dogodnym dla siebie czasie.
                - paragraph [ref=f5e312]: Kępska 12, 45-130 Opole
                - generic [ref=f5e321]:
                    - heading "Biuro" [level=4] [ref=f5e322]
                    - paragraph [ref=f5e323]: Spotkania odbywają się po wcześniejszym umówieniu telefonicznym, ponieważ większość czasu pracujemy u klientów oraz na realizacjach. ☎ Umów dogodny termin spotkania.
