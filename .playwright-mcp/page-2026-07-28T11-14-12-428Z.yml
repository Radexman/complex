                            - generic [ref=f5e214]: Pergole Ekonomiczne
                            - generic [ref=f5e215]: Praktyczne rozwiązanie w przystępnej cenie
            - generic [ref=f5e219]:
                - generic [ref=f5e220]:
                    - paragraph [ref=f5e221]: Specyfikacja
                    - heading "Montaż i specyfikacja techniczna" [level=2] [ref=f5e222]
                    - paragraph [ref=f5e223]: Realizujemy kompleksowy montaż zadaszeń — od pomiaru przez projekt po odbiór. Poniżej znajdziesz kluczowe informacje przed podjęciem decyzji.
                - generic [ref=f5e224]:
                    - generic [ref=f5e225]:
                        - heading "Montaż zadaszeń" [level=3] [ref=f5e230]
                        - paragraph [ref=f5e231]: Montaż realizujemy na terenie województw śląskiego i opolskiego. Czas realizacji od zamówienia wynosi zazwyczaj 3–6 tygodni. Ekipa montażowa pracuje sprawnie, minimalizując uciążliwości dla domowników.
                    - generic [ref=f5e232]:
                        - heading "Umowa i gwarancja" [level=3] [ref=f5e238]
                        - paragraph [ref=f5e239]: Każda realizacja objęta jest umową pisemną z określonym zakresem prac i terminem. Udzielamy gwarancji na wykonanie montażu oraz przekazujemy gwarancję producenta na materiały i konstrukcję.
                    - generic [ref=f5e240]:
                        - heading "Podatek VAT" [level=3] [ref=f5e245]
                        - paragraph [ref=f5e246]: Przy montażu zadaszeń na budynkach mieszkalnych zastosowanie może mieć obniżona stawka VAT 8%. Szczegóły ustalamy indywidualnie na etapie wyceny.
                    - generic [ref=f5e247]:
                        - heading "Realizacje" [level=3] [ref=f5e253]
                        - paragraph [ref=f5e254]: Zrealizowaliśmy setki zadaszeń na terenie Śląska i Opolszczyzny. Chętnie pokażemy przykłady podobnych realizacji w Twojej okolicy przed podjęciem decyzji.
                    - generic [ref=f5e255]:
                        - heading "Wymiary i konfiguracja" [level=3] [ref=f5e264]
                        - paragraph [ref=f5e265]: Zadaszenia wykonujemy na wymiar — szerokość do 8 m, wysięg do 4 m w zależności od systemu. Możliwość montażu do ściany lub jako konstrukcja wolnostojąca.
                    - generic [ref=f5e266]:
                        - heading "Bezpłatna konsultacja" [level=3] [ref=f5e271]
                        - paragraph [ref=f5e272]: Oferujemy bezpłatną wizytę pomiarową i konsultację na miejscu inwestycji. Skontaktuj się z nami, aby umówić termin.
            - generic [ref=f5e274]:
                - generic [ref=f5e276]: Bezpłatna wycena
                - heading "Gotowy na bezpłatną wycenę zadaszenia?" [level=2] [ref=f5e278]
                - paragraph [ref=f5e279]: Wypełnij formularz — przyjedziemy, zmierzymy i przedstawimy szczegółową wycenę bez zobowiązań.
                - generic [ref=f5e280]:
