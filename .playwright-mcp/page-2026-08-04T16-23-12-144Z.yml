                        - paragraph [ref=e65]: Pracujemy wyłącznie ze sprawdzonymi materiałami od renomowanych producentów. Każda realizacja jest objęta gwarancją.
                    - generic [ref=e66]:
                        - paragraph [ref=e71]: Profesjonalizm
                        - paragraph [ref=e72]: Pisemne umowy, ustalony termin, transparentna wycena. Wiemy, że Twój czas i inwestycja są cenne.
                    - generic [ref=e73]:
                        - paragraph [ref=e80]: Indywidualne podejście
