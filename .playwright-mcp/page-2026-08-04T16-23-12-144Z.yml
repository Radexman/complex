                    - generic [ref=e82]:
                        - paragraph [ref=e90]: Precyzja
                        - paragraph [ref=e91]: Każdy pomiar, każde cięcie, każdy montaż wykonujemy z dbałością o detal. Estetyka i funkcjonalność idą w parze.
                    - generic [ref=e92]:
