                - generic [ref=f1e48]:
                    - paragraph [ref=f1e49]: Nasza historia
                    - heading "Budujemy przestrzenie, które zostają na lata" [level=2] [ref=f1e50]
                    - generic [ref=f1e51]:
                        - paragraph [ref=f1e52]: Complex sp. z o.o. to firma z ugruntowaną pozycją w budownictwie zewnętrznym na terenie województwa śląskiego i opolskiego. Specjalizujemy się w kompleksowym wykonaniu tarasów, zadaszeń aluminiowych, żaluzji tarasowych, elewacji kompozytowych oraz schodów modułowych.
                        - paragraph [ref=f1e53]: Każdą realizację traktujemy indywidualnie — doradzamy w wyborze materiałów, projektujemy rozwiązania dopasowane do architektury budynku i oczekiwań klienta, a następnie realizujemy montaż własną ekipą z wieloletnim doświadczeniem.
                        - paragraph [ref=f1e54]: Nasze standardy to profesjonalizm, jakość wykonania i niezawodność. Każda inwestycja objęta jest pisemną umową i gwarancją, a klienci mogą liczyć na pełne wsparcie — od pierwszego kontaktu po odbiór gotowej realizacji.
            - generic [ref=f1e56]:
                - generic [ref=f1e57]:
                    - paragraph [ref=f1e58]: Nasze wartości
                    - heading "Co nas wyróżnia" [level=2] [ref=f1e59]
                - generic [ref=f1e60]:
                    - generic [ref=f1e61]:
                        - paragraph [ref=f1e66]: Jakość wykonania
                        - paragraph [ref=f1e67]: Pracujemy wyłącznie ze sprawdzonymi materiałami od renomowanych producentów. Każda realizacja jest objęta gwarancją.
                    - generic [ref=f1e68]:
                        - paragraph [ref=f1e73]: Profesjonalizm
                        - paragraph [ref=f1e74]: Pisemne umowy, ustalony termin, transparentna wycena. Wiemy, że Twój czas i inwestycja są cenne.
                    - generic [ref=f1e75]:
                        - paragraph [ref=f1e82]: Indywidualne podejście
                        - paragraph [ref=f1e83]: Słuchamy potrzeb klienta i projektujemy rozwiązania szyte na miarę — nie gotowe szablony.
                    - generic [ref=f1e84]:
                        - paragraph [ref=f1e92]: Precyzja
                        - paragraph [ref=f1e93]: Każdy pomiar, każde cięcie, każdy montaż wykonujemy z dbałością o detal. Estetyka i funkcjonalność idą w parze.
                    - generic [ref=f1e94]:
                        - paragraph [ref=f1e99]: Lokalny ekspert
                        - paragraph [ref=f1e100]: Działamy na terenie Śląska i Opolszczyzny — znamy specyfikę regionu i jesteśmy blisko naszych klientów.
                    - generic [ref=f1e101]:
                        - paragraph [ref=f1e106]: Zaufanie klientów
                        - paragraph [ref=f1e107]: 98% naszych klientów poleca nas znajomym. Budujemy relacje na długie lata, nie jednorazowe transakcje.
            - generic [ref=f1e109]:
