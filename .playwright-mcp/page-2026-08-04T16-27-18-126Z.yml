                    - heading "Od zapytania do gotowej realizacji" [level=2] [ref=f2e112]
                    - paragraph [ref=f2e113]: Przejrzysty proces współpracy – od bezpłatnej wyceny, przez pomiar i podpisanie umowy, aż po profesjonalny montaż.
                - generic [ref=f2e115]:
                    - generic [ref=f2e122]:
