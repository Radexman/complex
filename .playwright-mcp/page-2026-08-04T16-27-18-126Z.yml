                - generic [ref=f2e48]:
                    - paragraph [ref=f2e49]: Nasza historia
                    - heading "Budujemy przestrzenie, które zostają na lata" [level=2] [ref=f2e50]
                    - generic [ref=f2e51]:
                        - paragraph [ref=f2e52]: Complex sp. z o.o. to firma z ugruntowaną pozycją w budownictwie zewnętrznym na terenie województwa śląskiego i opolskiego. Specjalizujemy się w kompleksowym wykonaniu tarasów, zadaszeń aluminiowych, żaluzji tarasowych, elewacji kompozytowych oraz schodów modułowych.
                        - paragraph [ref=f2e53]: Każdą realizację traktujemy indywidualnie — doradzamy w wyborze materiałów, projektujemy rozwiązania dopasowane do architektury budynku i oczekiwań klienta, a następnie realizujemy montaż własną ekipą z wieloletnim doświadczeniem.
                        - paragraph [ref=f2e54]: Nasze standardy to profesjonalizm, jakość wykonania i niezawodność. Każda inwestycja objęta jest pisemną umową i gwarancją, a klienci mogą liczyć na pełne wsparcie — od pierwszego kontaktu po odbiór gotowej realizacji.
            - generic [ref=f2e56]:
                - generic [ref=f2e57]:
                    - paragraph [ref=f2e58]: Nasze wartości
                    - heading "Co nas wyróżnia" [level=2] [ref=f2e59]
                - generic [ref=f2e60]:
                    - generic [ref=f2e61]:
                        - paragraph [ref=f2e66]: Jakość wykonania
                        - paragraph [ref=f2e67]: Pracujemy wyłącznie ze sprawdzonymi materiałami od renomowanych producentów. Każda realizacja jest objęta gwarancją.
                    - generic [ref=f2e68]:
                        - paragraph [ref=f2e73]: Profesjonalizm
                        - paragraph [ref=f2e74]: Pisemne umowy, ustalony termin, transparentna wycena. Wiemy, że Twój czas i inwestycja są cenne.
                    - generic [ref=f2e75]:
                        - paragraph [ref=f2e82]: Indywidualne podejście
                        - paragraph [ref=f2e83]: Słuchamy potrzeb klienta i projektujemy rozwiązania szyte na miarę — nie gotowe szablony.
                    - generic [ref=f2e84]:
                        - paragraph [ref=f2e92]: Precyzja
                        - paragraph [ref=f2e93]: Każdy pomiar, każde cięcie, każdy montaż wykonujemy z dbałością o detal. Estetyka i funkcjonalność idą w parze.
                    - generic [ref=f2e94]:
                        - paragraph [ref=f2e99]: Lokalny ekspert
                        - paragraph [ref=f2e100]: Działamy na terenie Śląska i Opolszczyzny — znamy specyfikę regionu i jesteśmy blisko naszych klientów.
                    - generic [ref=f2e101]:
                        - paragraph [ref=f2e106]: Zaufanie klientów
                        - paragraph [ref=f2e107]: 98% naszych klientów poleca nas znajomym. Budujemy relacje na długie lata, nie jednorazowe transakcje.
            - generic [ref=f2e109]:
                - generic [ref=f2e110]:
